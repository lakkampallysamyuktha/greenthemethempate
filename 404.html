<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 - Page Not Found | Stackly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="404.css">
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fa-solid fa-leaf"></i>
        </div>
        <div class="error-code">404</div>
        <h1 class="error-title">Page not found</h1>
        <p class="error-message">The page you are looking for doesn't exist or has been moved.</p>
        
        <div class="button-group">
            <a href="index.html" class="btn-home">
                <i class="fa-solid fa-house"></i> Back to Home
            </a>
            <a href="index.html" class="btn-menu">
                <i class="fa-solid fa-bars"></i> Main Menu
            </a>
        </div>
    </div>
</body>
</html>
