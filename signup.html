<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Stackly — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <div id="particles" class="particles"></div>
  <a href="login.html" class="back-btn"><i class="ph ph-arrow-left"></i> Back to Sign In</a>

  <div class="signup-container">
    <div class="form-card">
      <div class="form-header">
        <a href="index.html" class="nav-logo">
          <img src="logo-removebg-preview.webp" alt="Stackly" class="nav-logo-img">
        </a>
        <h2>Create account</h2>
        <p>Join the clean energy revolution</p>
      </div>

      <div class="form-fields">
        <div class="field-row">
          <div class="field-group">
            <label for="firstName">First name <span class="required">*</span></label>
            <div class="input-wrap">
              <i class="ph ph-user"></i>
              <input type="text" id="firstName" placeholder="John" required>
            </div>
          </div>
          <div class="field-group">
            <label for="lastName">Last name</label>
            <div class="input-wrap">
              <i class="ph ph-user"></i>
              <input type="text" id="lastName" placeholder="Doe">
            </div>
          </div>
        </div>

        <div class="field-group">
          <label for="signupEmail">Email address <span class="required">*</span></label>
          <div class="input-wrap">
            <i class="ph ph-envelope"></i>
            <input type="email" id="signupEmail" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="field-group">
          <label for="signupPassword">Password <span class="required">*</span></label>
          <div class="input-wrap">
            <i class="ph ph-lock-key"></i>
            <input type="password" id="signupPassword" placeholder="Create a password" required>
            <button type="button" class="toggle-pw" id="togglePw"><i class="ph ph-eye" id="pwIcon"></i></button>
          </div>
          <div class="pw-strength"><div class="pw-bar" id="pwBar"></div></div>
          <span class="pw-label" id="pwLabel"></span>
        </div>

        <div class="field-group">
          <label for="confirmPassword">Confirm password <span class="required">*</span></label>
          <div class="input-wrap">
            <i class="ph ph-lock-key"></i>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
            <button type="button" class="toggle-pw" id="toggleConfirmPw"><i class="ph ph-eye" id="confirmPwIcon"></i></button>
          </div>
          <span class="error-msg" id="confirmError"></span>
        </div>

        <div class="field-group">
          <label for="organization">Organization (optional)</label>
          <div class="input-wrap">
            <i class="ph ph-buildings"></i>
            <input type="text" id="organization" placeholder="Your company">
          </div>
        </div>

        <div class="field-group">
          <label for="roleSelect">Account role <span class="required">*</span></label>
          <div class="input-wrap">
            <i class="ph ph-briefcase"></i>
            <select id="roleSelect" required>
              <option value="">Select role</option>
              <option value="viewer">Viewer – View dashboards & reports</option>
              <option value="admin">Admin – Full management access</option>
            </select>
          </div>
        </div>

        <div class="error-message" id="formError"></div>

        <button class="btn-create" id="createBtn">
          <span>Create Account</span>
          <i class="ph ph-arrow-right"></i>
        </button>
      </div>

      <p class="login-prompt">Already have an account? <a href="login.html" class="login-link">Sign in</a></p>
    </div>
  </div>

  <script src="signup.js"></script>
</body>
</html>
